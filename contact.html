<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Bronson Castillo</title>
    <style>
        /* Apple SF Pro Aesthetic Core Styling */
        body {
            background-color: #08080a;
            color: #f5f5f7;
            font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            letter-spacing: -0.015em;
            -webkit-font-smoothing: antialiased;
            position: relative;
        }

        /* Seamless Lightning-Fast Page Fade Overlay */
        #page-transition-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #08080a;
            z-index: 9999;
            opacity: 1;
            pointer-events: none;
            transition: opacity 0.1s ease-in-out;
        }
        body.fade-out #page-transition-overlay {
            opacity: 1;
        }
        body.fade-in #page-transition-overlay {
            opacity: 0;
        }

        /* Top-to-Bottom Entrance Staggering Keyframes */
        @keyframes slideDownEntrance {
            0% {
                opacity: 0;
                transform: translateY(-20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        nav {
            animation: slideDownEntrance 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .main-header {
            animation: slideDownEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
            opacity: 0;
        }
        .container {
            animation: slideDownEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
            opacity: 0;
        }

        /* Fixed Background Hero Image with Smooth Fade-In */
        .bg-hero {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('./assets/abco bg.jpg');
            background-size: cover;
            background-position: center;
            z-index: -2;
            filter: blur(0px);
            transform: scale(1.05);
            opacity: 0;
            animation: bgFadeIn 1s ease-out 0.1s forwards;
        }

        @keyframes bgFadeIn {
            to {
                opacity: 1;
            }
        }

        /* Cinematic Dark Overlay for Contrast */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(180deg, rgba(8, 8, 10, 0.90) 0%, rgba(8, 8, 10, 0.60) 45%, rgba(8, 8, 10, 0.92) 100%);
            z-index: -1;
            pointer-events: none;
        }

        /* Frosted Glass Navigation */
        nav {
            position: sticky; top: 0; z-index: 1000;
            display: flex; justify-content: space-between; align-items: center;
            padding: 18px 40px; background: rgba(12, 12, 15, 0.75);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .nav-links {
            display: flex;
            gap: 28px;
            align-items: center;
        }
        nav a {
            color: #F4D03F; /* Studio Yellow by default */
            text-decoration: none;
            font-weight: 500;
            font-size: 0.92rem;
            transition: color 0.2s ease;
        }
        nav a:hover {
            color: #ffffff; /* Crisp white on hover */
        }
        .nav-logo {
            font-weight: 700;
            font-size: 1.05rem;
            letter-spacing: 0.05em;
            color: #F4D03F; /* Studio Yellow by default */
            text-decoration: none;
            transition: color 0.2s ease;
        }
        .nav-logo:hover {
            color: #ffffff; /* Crisp white on hover */
        }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: #F4D03F;
            font-size: 1.6rem;
            cursor: pointer;
            padding: 4px 8px;
            line-height: 1;
        }

        /* Main Content Container */
        .container {
            max-width: 600px;
            margin: 60px auto;
            padding: 0 30px;
            text-align: center;
        }

        /* Centered Main Header */
        .main-header {
            margin-bottom: 40px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.9);
        }
        h1 {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 8px;
            color: #FFFFFF;
            text-align: center;
        }
        .subtitle {
            color: #f5f5f7;
            font-size: 1.2rem;
            font-weight: 400;
            margin-bottom: 0;
            text-align: center;
        }

        /* Contact Details Card */
        .contact-card {
            background-color: rgba(18, 18, 22, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 12px;
            padding: 40px 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 30px;
        }
        
        .email-link {
            display: inline-block;
            color: #F4D03F;
            font-size: 1.3rem;
            font-weight: 600;
            text-decoration: none;
            margin-top: 10px;
            letter-spacing: 0.5px;
            transition: color 0.2s;
            word-break: break-all;
        }
        .email-link:hover {
            color: #ffffff;
        }

        /* Social Icon Buttons Layout */
        .socials-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(18, 18, 22, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #FFFFFF;
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 55px;
            height: 55px;
            border-radius: 50%;
            text-decoration: none;
            transition: background-color 0.2s, border-color 0.2s, transform 0.2s, color 0.2s;
        }
        .social-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            transition: fill 0.2s;
        }
        .social-btn:hover {
            background-color: rgba(24, 24, 30, 0.9);
            border-color: #F4D03F;
            color: #F4D03F;
            transform: translateY(-3px);
            box-shadow: 0 0 15px rgba(244, 208, 63, 0.2);
        }

        @media screen and (max-width: 768px) {
            nav { padding: 16px 20px; }
            .menu-toggle { display: block; }
            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background: rgba(12, 12, 15, 0.96);
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                padding: 24px 20px;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
                box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6);
                gap: 20px;
                text-align: center;
            }
            .nav-links.active { display: flex; }
            .nav-links a { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <!-- Fixed Hero Background & Overlay -->

    <div class="bg-overlay"></div>

    <!-- Navigation -->
    <nav>
        <a href="index.html" class="nav-logo">BRONSON CASTILLO</a>
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation">

        </button>
        <div class="nav-links" id="navLinks">

        </div>
    </div>

    <!-- Scripts -->
    <script>
        const menuToggle = document.getElementById('menuToggle');
        const navLinks = document.getElementById('navLinks');
        const menuIcon = menuToggle.querySelector('.menu-icon');

        menuToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            navLinks.classList.toggle('active');
            menuIcon.textContent = navLinks.classList.contains('active') ? '✕' : '☰';
        });

        document.addEventListener('click', (e) => {
            if (!navLinks.contains(e.target) && !menuToggle.contains(e.target)) {
                navLinks.classList.remove('active');
                menuIcon.textContent = '☰';
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            document.body.classList.add('fade-in');
        });

        document.querySelectorAll('nav a, a.nav-logo').forEach(link => {
            link.addEventListener('click', function(e) {
                const targetUrl = this.getAttribute('href');
                if (targetUrl && targetUrl.endsWith('.html')) {
                    e.preventDefault();
                    document.body.classList.remove('fade-in');
                    document.body.classList.add('fade-out');
                    setTimeout(() => {
                        window.location.href = targetUrl;
                    }, 100);
                }
            });
        });

        const heroBg = document.getElementById('heroBg');
        window.addEventListener('scroll', () => {
            const scrollPos = window.scrollY;
            const blurAmount = Math.min(scrollPos / 25, 20);
            heroBg.style.filter = `blur(${blurAmount}px)`;
        });
    </script>
</body>
</html>
